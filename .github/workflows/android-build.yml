name: Build Android APK

# Builds android-native/ into a debug .apk on GitHub's own servers — this
# repo's local dev environment has no JDK/Android SDK installed, so this
# is the only way to get a real installable .apk without setting up
# Android Studio somewhere. Debug build on purpose (auto-signed with a
# throwaway debug key): fine for sideloading straight to a phone, not
# meant for a Play Store submission (that would need a proper release
# signing key, a separate step if ever needed).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-native/**'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-native
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Every GitHub Actions run is a fresh throwaway machine — without
      # this, Android's default debug-signing behavior (auto-generate
      # ~/.android/debug.keystore if it doesn't exist yet) would mean
      # every single build gets signed with a brand new random key,
      # and Android refuses to install a new APK over an existing one
      # signed with a different key ("App not installed" / signature
      # conflict) unless the old one is uninstalled first. Caching this
      # one file across runs keeps every build's debug signature
      # identical, so a fresh download can just install over the last
      # one like a normal update.
      - name: Restore cached debug keystore
        id: keystore-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Generate debug keystore (first run only)
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -dname "CN=Android Debug,O=Android,C=US"

      # Required at build time (the google-services Gradle plugin reads
      # it to wire up this app's Firebase project config) — stored as a
      # repo secret, never committed, since it identifies a specific
      # Firebase app registration. See android-native/README.md for how
      # to create this secret.
      - name: Write google-services.json from secret
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_B64 }}" | base64 -d > app/google-services.json

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: airmoon-debug-apk
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
