<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Poppins', -apple-system, sans-serif; }
  </style>
</helmet>

<div style="width: 390px; background: #ffffff; border-radius: 28px; box-shadow: 0 24px 60px rgba(15,32,25,0.16); overflow: hidden; color: #0f2019;">
  <div style="display: flex; flex-direction: column; gap: 18px; padding: 32px 20px 36px;">

    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #eef5f3;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#0f2019">
          <path d="M15 5 8 12l7 7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span style="font-size: 15px; font-weight: 800;">Pengaturan</span>
      <div style="width: 38px; height: 38px;"></div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 14px; padding: 16px; border-radius: 18px; border: 1px solid #e5edeb;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: #e2f1ec;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{primary}}">
            <circle cx="12" cy="12" r="9" stroke-width="1.6"/>
            <path d="M3 12h18M12 3c2.3 2.5 3.6 5.6 3.6 9s-1.3 6.5-3.6 9c-2.3-2.5-3.6-5.6-3.6-9s1.3-6.5 3.6-9Z" stroke-width="1.6"/>
          </svg>
        </div>
        <div style="display: flex; flex-direction: column; gap: 1px;">
          <span style="font-size: 13px; font-weight: 700;">Bahasa Aplikasi</span>
          <span style="font-size: 11px; color: #5c6b67;">Ubah bahasa tampilan airmoon</span>
        </div>
      </div>
      <div style="display: flex; padding: 3px; border-radius: 999px; background: #eef5f3;">
        <div style="flex: 1; text-align: center; padding: 9px 0; border-radius: 999px; font-size: 12.5px; font-weight: 700; color: #ffffff; background: {{primary}};">Indonesia</div>
        <div style="flex: 1; text-align: center; padding: 9px 0; border-radius: 999px; font-size: 12.5px; font-weight: 700; color: #5c6b67;">English</div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 14px; padding: 16px; border-radius: 18px; border: 1px solid #e5edeb;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: #fbf0d9;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a9761f">
            <circle cx="12" cy="12" r="4.3" stroke-width="1.6"/>
            <path d="M12 2.5v3M12 18.5v3M4.7 4.7l2.1 2.1M17.2 17.2l2.1 2.1M1.5 12h3M19.5 12h3M4.7 19.3l2.1-2.1M17.2 6.8l2.1-2.1" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </div>
        <div style="display: flex; flex-direction: column; gap: 1px;">
          <span style="font-size: 13px; font-weight: 700;">Tampilan</span>
          <span style="font-size: 11px; color: #5c6b67;">Sesuaikan tema terang atau gelap</span>
        </div>
      </div>
      <div style="display: flex; padding: 3px; border-radius: 999px; background: #eef5f3;">
        <div style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 0; border-radius: 999px; font-size: 12.5px; font-weight: 700; color: #ffffff; background: {{primary}};">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#ffffff">
            <circle cx="12" cy="12" r="4.3" stroke-width="1.7"/>
            <path d="M12 2.5v2.6M12 18.9v2.6M4.7 4.7l1.8 1.8M17.5 17.5l1.8 1.8M1.5 12h2.6M19.9 12h2.6M4.7 19.3l1.8-1.8M17.5 6.5l1.8-1.8" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
          Light
        </div>
        <div style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 0; border-radius: 999px; font-size: 12.5px; font-weight: 700; color: #5c6b67;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" stroke="none">
            <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 1 0 10.5 10.5Z"/>
          </svg>
          Dark
        </div>
      </div>
    </div>

  </div>
</div>

</x-dc>
<script data-dc-script data-props='{"primary":{"editor":"color","default":"#0d4d47","section":"Colors"}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      primary: this.props.primary ?? '#0d4d47'
    };
  }
}
</script>
</body>
</html>
