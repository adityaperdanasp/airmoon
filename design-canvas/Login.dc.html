<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Poppins', -apple-system, sans-serif; }
    a { color: #0d4d47; }
    a:hover { color: #0a3630; }
    ::placeholder { color: #8a9c99; }
  </style>
</helmet>

<div style="width: 390px; background: #ffffff; border-radius: 28px; box-shadow: 0 24px 60px rgba(15,32,25,0.16); overflow: hidden; color: #0f2019;">
  <div style="display: flex; flex-direction: column; gap: 28px; padding: 52px 24px 44px;">

    <div style="display: flex; flex-direction: column; align-items: center; gap: 12px;">
      <div style="width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: {{primary}};">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
          <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 1 0 10.5 10.5Z" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M15.3 4.2 16.1 6.3 18.2 7.1 16.1 7.9 15.3 10 14.5 7.9 12.4 7.1 14.5 6.3Z" fill="#ffffff" stroke="none"/>
        </svg>
      </div>
      <span style="font-size: 19px; font-weight: 800; letter-spacing: -0.01em; color: {{primary}};">airmoon</span>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center;">
      <h1 style="margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.01em;">Selamat datang kembali</h1>
      <p style="margin: 0; font-size: 13px; color: #5c6b67;">Masuk buat lanjutin ibadah &amp; sedekahmu</p>
    </div>

    <div style="display: flex; flex-direction: column; gap: 16px;">

      <div style="display: flex; flex-direction: column; gap: 7px;">
        <span style="font-size: 12px; font-weight: 700;">Email</span>
        <div style="display: flex; align-items: center; gap: 10px; border-radius: 14px; padding: 13px 15px; background: #eef5f3;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#5c6b67" style="flex-shrink: 0;">
            <rect x="2.5" y="4.5" width="19" height="15" rx="2.5" stroke-width="1.6"/>
            <path d="m3.5 6 8.5 6.5L20.5 6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span style="font-size: 13.5px; color: #5c6b67;">nama@email.com</span>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 7px;">
        <span style="font-size: 12px; font-weight: 700;">Password</span>
        <div style="display: flex; align-items: center; gap: 10px; border-radius: 14px; padding: 13px 15px; background: #eef5f3;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#5c6b67" style="flex-shrink: 0;">
            <rect x="4" y="10.5" width="16" height="10" rx="2.3" stroke-width="1.6"/>
            <path d="M7.5 10.5V7a4.5 4.5 0 0 1 9 0v3.5" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          <span style="flex: 1; font-size: 13.5px; letter-spacing: 2px; color: #5c6b67;">&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;</span>
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8a9c99" style="flex-shrink: 0;">
            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z" stroke-width="1.6" stroke-linejoin="round"/>
            <circle cx="12" cy="12" r="3" stroke-width="1.6"/>
          </svg>
        </div>
      </div>

      <a href="#" style="align-self: flex-end; font-size: 12px; font-weight: 700; text-decoration: none; color: {{primary}};">Lupa password?</a>

      <button style="width: 100%; padding: 15px; border: none; border-radius: 999px; font-family: inherit; font-weight: 700; font-size: 14px; cursor: pointer; color: #ffffff; background: {{primary}};">Masuk</button>

      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="flex: 1; height: 1px; background: #e5edeb;"></div>
        <span style="font-size: 11.5px; font-weight: 600; color: #5c6b67;">atau</span>
        <div style="flex: 1; height: 1px; background: #e5edeb;"></div>
      </div>

      <button style="display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 14px; border: 1px solid #e5edeb; border-radius: 999px; font-family: inherit; font-weight: 700; font-size: 13.5px; cursor: pointer; color: #0f2019; background: #ffffff;">
        <svg width="18" height="18" viewBox="0 0 18 18">
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.68-3.87 2.68-6.62Z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.33A9 9 0 0 0 9 18Z"/>
          <path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.03l2.99-2.33Z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.97l2.99 2.33C4.66 5.17 6.65 3.58 9 3.58Z"/>
        </svg>
        <span>Lanjutkan dengan Google</span>
      </button>

    </div>

    <p style="margin: 0; text-align: center; font-size: 13px; color: #5c6b67;">Belum punya akun? <a href="#" style="font-weight: 700; text-decoration: none; color: {{primary}};">Daftar</a></p>

  </div>
</div>

</x-dc>
<script data-dc-script data-props='{"primary":{"editor":"color","default":"#0d4d47","section":"Colors"}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      primary: this.props.primary ?? '#0d4d47'
    };
  }
}
</script>
</body>
</html>
