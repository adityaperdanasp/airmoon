name: Build Android APK

# Builds android-native/ into a debug .apk on GitHub's own servers — this
# repo's local dev environment has no JDK/Android SDK installed, so this
# is the only way to get a real installable .apk without setting up
# Android Studio somewhere. Debug build on purpose (auto-signed with a
# throwaway debug key): fine for sideloading straight to a phone, not
# meant for a Play Store submission (that would need a proper release
# signing key, a separate step if ever needed).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-native/**'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-native
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Required at build time (the google-services Gradle plugin reads
      # it to wire up this app's Firebase project config) — stored as a
      # repo secret, never committed, since it identifies a specific
      # Firebase app registration. See android-native/README.md for how
      # to create this secret.
      - name: Write google-services.json from secret
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_B64 }}" | base64 -d > app/google-services.json

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: airmoon-debug-apk
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
