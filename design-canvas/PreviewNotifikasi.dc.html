<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Poppins', -apple-system, sans-serif; }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 620px; border-radius: 28px; overflow: hidden; box-shadow: 0 24px 60px rgba(15,32,25,0.16); background: radial-gradient(120% 90% at 30% 0%, #123c37 0%, #071612 55%, #030807 100%);">

  <svg style="position: absolute; top: 0; right: 0; width: 260px; height: 260px; opacity: 0.5; pointer-events: none;" viewBox="0 0 300 300" fill="none">
    <g stroke="rgba(255,255,255,0.08)" stroke-width="1.3">
      <path d="M340 -20 C 295 20,295 60,340 100 C295 140,295 180,340 220"/>
      <path d="M320 -20 C 275 20,275 60,320 100 C275 140,275 180,320 220"/>
      <path d="M300 -20 C 255 20,255 60,300 100 C255 140,255 180,300 220"/>
    </g>
  </svg>

  <div style="position: relative; display: flex; flex-direction: column; align-items: center; padding-top: 56px;">
    <span style="font-size: 54px; font-weight: 700; color: #ffffff; letter-spacing: -0.02em;">15:22</span>
    <span style="font-size: 13px; color: rgba(255,255,255,0.65); margin-top: 4px;">Kamis, 21 Agustus &middot; 7 Safar 1448 H</span>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; top: 200px; display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 20px; background: rgba(255,255,255,0.1); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.14);">
    <div style="display: flex; align-items: center; gap: 8px;">
      <div style="width: 20px; height: 20px; border-radius: 6px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: {{primary}};">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#ffffff"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 1 0 10.5 10.5Z" stroke-width="2"/></svg>
      </div>
      <span style="font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.8); flex: 1;">airmoon</span>
      <span style="font-size: 11px; color: rgba(255,255,255,0.75);">sekarang</span>
    </div>
    <div style="display: flex; align-items: flex-start; gap: 12px;">
      <div style="width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: {{accent}};">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{primaryDark}}">
          <path d="M4 20h16" stroke-width="1.7" stroke-linecap="round"/>
          <path d="M6 20v-5.5a6 6 0 0 1 12 0V20" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M12 8.5V4" stroke-width="1.7" stroke-linecap="round"/>
          <circle cx="12" cy="3" r="0.9" fill="{{primaryDark}}" stroke="none"/>
        </svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0;">
        <span style="font-size: 14px; font-weight: 800; color: #ffffff;">Waktunya Sholat Ashar</span>
        <span style="font-size: 12px; line-height: 1.45; color: rgba(255,255,255,0.75);">Ashar telah masuk waktunya di Jakarta Selatan. Yuk tunaikan sholat.</span>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 24px; right: 24px; bottom: 28px; display: flex; justify-content: center;">
    <div style="width: 130px; height: 5px; border-radius: 999px; background: rgba(255,255,255,0.35);"></div>
  </div>

</div>

</x-dc>
<script data-dc-script data-props='{"primary":{"editor":"color","default":"#0d4d47","section":"Colors"},"primaryDark":{"editor":"color","default":"#0a3630","section":"Colors"},"accent":{"editor":"color","default":"#e8b84b","section":"Colors"}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      primary: this.props.primary ?? '#0d4d47',
      primaryDark: this.props.primaryDark ?? '#0a3630',
      accent: this.props.accent ?? '#e8b84b'
    };
  }
}
</script>
</body>
</html>
