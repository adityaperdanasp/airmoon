<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Poppins', -apple-system, sans-serif; }
  </style>
</helmet>

<div style="width: 390px; background: #ffffff; border-radius: 28px; box-shadow: 0 24px 60px rgba(15,32,25,0.16); overflow: hidden; color: #0f2019;">
  <div style="display: flex; flex-direction: column; gap: 18px; padding: 32px 20px 36px;">

    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #eef5f3;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#0f2019">
          <path d="M15 5 8 12l7 7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span style="font-size: 15px; font-weight: 800;">Makkah Live</span>
      <div style="width: 38px; height: 38px;"></div>
    </div>

    <div style="position: relative; overflow: hidden; border-radius: 20px; aspect-ratio: 16 / 9; display: flex; align-items: center; justify-content: center; background: linear-gradient(160deg, #1a2b28, #060b0a);">
      <svg style="position: absolute; inset: 0;" width="100%" height="100%" viewBox="0 0 350 197" preserveAspectRatio="xMidYMid slice">
        <rect width="350" height="197" fill="#0c1614"/>
        <rect x="150" y="120" width="55" height="45" fill="#1c2b26"/>
        <rect x="150" y="132" width="55" height="6" fill="#c9a24a"/>
      </svg>
      <div style="position: absolute; top: 12px; left: 12px; display: flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 999px; background: #d92d2d;">
        <div style="width: 6px; height: 6px; border-radius: 50%; background: #ffffff;"></div>
        <span style="font-size: 10px; font-weight: 800; color: #ffffff; letter-spacing: 0.03em;">LIVE</span>
      </div>
      <div style="position: absolute; top: 12px; right: 12px; display: flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 999px; background: rgba(0,0,0,0.5);">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#ffffff"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke-width="1.8"/></svg>
        <span style="font-size: 10px; font-weight: 700; color: #ffffff;">18.2K</span>
      </div>
      <div style="width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.16); backdrop-filter: blur(6px);">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="#ffffff" stroke="none"><path d="M8 5.5v13l11-6.5-11-6.5Z"/></svg>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px;">
      <span style="font-size: 15px; font-weight: 800;">Siaran Langsung Masjidil Haram</span>
      <span style="font-size: 12px; color: #5c6b67;">Makkah, Arab Saudi &middot; Channel Resmi</span>
    </div>

    <div style="display: flex; gap: 8px;">
      <div style="padding: 9px 16px; border-radius: 999px; font-size: 12px; font-weight: 700; color: #ffffff; background: {{primary}};">Masjidil Haram</div>
      <div style="padding: 9px 16px; border-radius: 999px; font-size: 12px; font-weight: 700; color: #5c6b67; background: #eef5f3;">Masjid Nabawi</div>
    </div>

    <div style="display: flex; align-items: flex-start; gap: 10px; padding: 13px 14px; border-radius: 14px; background: #fbf0d9;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#a9761f" style="flex-shrink: 0; margin-top: 1px;">
        <circle cx="12" cy="12" r="9" stroke-width="1.6"/><path d="M12 11v5.5M12 8v.01" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <span style="font-size: 11px; line-height: 1.5; color: #7a5a1a;">Siaran disediakan channel resmi pihak berwenang Masjidil Haram &amp; Masjid Nabawi, ditampilkan lewat embed player.</span>
    </div>

  </div>
</div>

</x-dc>
<script data-dc-script data-props='{"primary":{"editor":"color","default":"#0d4d47","section":"Colors"}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      primary: this.props.primary ?? '#0d4d47'
    };
  }
}
</script>
</body>
</html>
