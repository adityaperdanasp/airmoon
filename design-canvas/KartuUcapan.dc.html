<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Poppins', -apple-system, sans-serif; }
  </style>
</helmet>

<div style="width: 390px; background: #ffffff; border-radius: 28px; box-shadow: 0 24px 60px rgba(15,32,25,0.16); overflow: hidden; color: #0f2019;">
  <div style="display: flex; flex-direction: column; gap: 18px; padding: 32px 20px 36px;">

    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #eef5f3;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#0f2019">
          <path d="M15 5 8 12l7 7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span style="font-size: 15px; font-weight: 800;">Kartu Ucapan</span>
      <div style="width: 38px; height: 38px;"></div>
    </div>

    <div style="position: relative; overflow: hidden; border-radius: 22px; aspect-ratio: 4 / 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 28px; text-align: center; background: linear-gradient(160deg, {{primary}}, {{primaryDark}});">
      <svg style="position: absolute; top: -20px; right: -30px; width: 180px; height: 180px; pointer-events: none;" viewBox="0 0 300 160" preserveAspectRatio="xMaxYMin slice">
        <g stroke="rgba(255,255,255,0.14)" stroke-width="1.3" fill="none">
          <path d="M320 -10 C 285 20,285 50,320 80 C285 110,285 140,320 170"/>
          <path d="M300 -10 C 265 20,265 50,300 80 C265 110,265 140,300 170"/>
          <path d="M280 -10 C 245 20,245 50,280 80 C245 110,245 140,280 170"/>
        </g>
      </svg>
      <span style="position: relative; font-family: 'Amiri', serif; font-size: 26px; color: {{accent}};">تقبل الله منا ومنكم</span>
      <span style="position: relative; font-size: 22px; font-weight: 800; color: #ffffff;">Selamat Idul Fitri</span>
      <span style="position: relative; font-size: 12px; color: rgba(255,255,255,0.75);">Mohon maaf lahir &amp; batin</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <span style="font-size: 13px; font-weight: 800;">Pilih Template</span>
      <div style="display: flex; gap: 10px;">
        <div style="width: 56px; height: 70px; border-radius: 12px; border: 2px solid {{primary}}; background: linear-gradient(160deg, {{primary}}, {{primaryDark}});"></div>
        <div style="width: 56px; height: 70px; border-radius: 12px; background: linear-gradient(160deg, #a9761f, #6b4a12);"></div>
        <div style="width: 56px; height: 70px; border-radius: 12px; background: linear-gradient(160deg, #3f5c68, #23343b);"></div>
        <div style="width: 56px; height: 70px; border-radius: 12px; background: linear-gradient(160deg, #a9622f, #6b3d1c);"></div>
      </div>
    </div>

    <div style="display: flex; gap: 10px;">
      <button style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px; border: 1px solid #e5edeb; border-radius: 999px; font-family: inherit; font-weight: 700; font-size: 13px; cursor: pointer; color: #0f2019; background: #ffffff;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#0f2019"><path d="M12 3v13m0 0-4-4m4 4 4-4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke-width="1.8" stroke-linecap="round"/></svg>
        Simpan
      </button>
      <button style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px; border: none; border-radius: 999px; font-family: inherit; font-weight: 700; font-size: 13px; cursor: pointer; color: #ffffff; background: {{primary}};">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#ffffff"><circle cx="18" cy="5" r="2.4" stroke-width="1.7"/><circle cx="6" cy="12" r="2.4" stroke-width="1.7"/><circle cx="18" cy="19" r="2.4" stroke-width="1.7"/><path d="m8.2 10.7 7.6-4.4M8.2 13.3l7.6 4.4" stroke-width="1.7"/></svg>
        Bagikan
      </button>
    </div>

  </div>
</div>

</x-dc>
<script data-dc-script data-props='{"primary":{"editor":"color","default":"#0d4d47","section":"Colors"},"primaryDark":{"editor":"color","default":"#0a3630","section":"Colors"},"accent":{"editor":"color","default":"#e8b84b","section":"Colors"}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      primary: this.props.primary ?? '#0d4d47',
      primaryDark: this.props.primaryDark ?? '#0a3630',
      accent: this.props.accent ?? '#e8b84b'
    };
  }
}
</script>
</body>
</html>
